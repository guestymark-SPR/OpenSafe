name: Build Windows app

# Every push to main builds the installer.
# If package.json has a version that hasn't been released yet, the build is also
# published as a GitHub release (tag v<version>). Installed copies of OpenSafe
# find it and update themselves.
# To release an update: bump "version" in package.json and push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version v$v is already released - building only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version v$v is new - building and publishing a release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (no release)
        if: steps.ver.outputs.release != 'true'
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Build and publish release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish always

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenSafe-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
