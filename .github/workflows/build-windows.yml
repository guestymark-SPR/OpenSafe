name: Build Windows app

# Every push to main builds the installer.
# If package.json has a version that hasn't been released yet, the build is also
# published as a GitHub release (tag v<version>), including latest.yml for auto-update. Installed copies of OpenSafe
# find it and update themselves.
# To release an update: bump "version" in package.json and push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Check receipt reading works in the built app
        shell: pwsh
        run: |
          $env:OPENSAFE_DATA_DIR = "$env:RUNNER_TEMP\osdata"
          $env:OPENSAFE_OCR_SELFTEST = "$PWD\test\fixtures\receipt.jpg"
          $env:OPENSAFE_OCR_SELFTEST_OUT = "$env:RUNNER_TEMP\ocr.txt"
          $p = Start-Process -FilePath "dist\win-unpacked\OpenSafe.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "The app didn't finish the receipt check in 2 minutes" }
          $r = Get-Content "$env:RUNNER_TEMP\ocr.txt" -Raw
          Write-Host $r
          if ($r -notmatch '"shop":"Screwfix"' -or $r -notmatch '189.97') { throw "Receipt reading self-test failed" }

      - name: Publish release if this version is new (or incomplete)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          files=("dist/OpenSafe-Setup-$v.exe" "dist/OpenSafe-Setup-$v.exe.blockmap" "dist/OpenSafe-Portable-$v.exe" dist/latest.yml)
          ls -la "${files[@]}"
          if ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Creating release v$v"
            gh release create "v$v" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "OpenSafe $v" --generate-notes
          elif ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx latest.yml; then
            echo "Release v$v exists but is missing latest.yml - uploading files"
            gh release upload "v$v" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Release v$v already complete - nothing to publish"
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenSafe-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
