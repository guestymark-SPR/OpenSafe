<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' keep: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="styles.css">
<title>OpenSafe</title>
</head>
<body>
<aside class="side">
  <div class="brand"><img src="icon.png" alt=""><span>OpenSafe</span></div>
  <nav id="nav">
    <button data-nav="dashboard"><span class="i">◧</span>Dashboard</button>
    <button data-nav="items"><span class="i">▤</span>Items</button>
    <button data-nav="reminders"><span class="i">◷</span>Reminders <b id="remBadge" class="badge hidden"></b></button>
    <button data-nav="phone"><span class="i">⇩</span>Import Files</button>
    <button data-nav="reports"><span class="i">⎙</span>Reports</button>
    <button data-nav="settings"><span class="i">⚙</span>Settings</button>
  </nav>
  <button id="addBtn" class="btn primary wide" data-action="new">+ Add item</button>
</aside>
<div class="mainwrap"><div id="updBar" class="updbar hidden"></div><main id="view" tabindex="-1"></main></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="lightbox" class="lightbox hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="app.js"></script>
</body>
</html>
