<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4d4f">
<link rel="manifest" href="/m/manifest.json">
<link rel="icon" href="/m/icon.png">
<link rel="stylesheet" href="/m/style.css">
<title>OpenKeep – add item</title>
</head>
<body>
<header>
  <img src="/m/icon.png" alt="" class="logo">
  <div><h1>OpenKeep</h1><div id="conn" class="conn">Connecting…</div></div>
</header>

<main>
  <section id="unpaired" class="card hidden">
    <h2>Pair this phone</h2>
    <p>On your PC, open OpenKeep, go to <b>Phone</b>, switch the link on, then scan the QR code with this phone's camera.</p>
  </section>

  <form id="form" class="hidden" autocomplete="off" novalidate>
    <section class="card">
      <h2>Photos</h2>
      <div id="thumbs" class="thumbs"></div>
      <div class="row2">
        <label class="btn primary">📷 Take photo
          <input type="file" id="cam" accept="image/*" capture="environment" hidden>
        </label>
        <label class="btn">🖼️ From gallery
          <input type="file" id="gallery" accept="image/*" multiple hidden>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Item</h2>
      <label>Name <span class="req">*</span><input name="name" required maxlength="200" placeholder="e.g. Cordless drill"></label>
      <div class="row2">
        <label>Category<input name="category" list="cats" maxlength="60"></label>
        <label>Location<input name="location" list="locs" maxlength="60"></label>
      </div>
      <div class="row2">
        <label>Brand<input name="brand" maxlength="200"></label>
        <label>Model<input name="model" maxlength="200"></label>
      </div>
      <label>Serial number<input name="serial" maxlength="200" autocapitalize="characters"></label>
      <label>Condition<select name="condition" id="cond"><option value="">—</option></select></label>
    </section>

    <section class="card">
      <h2>Value</h2>
      <div class="row2">
        <label>Price paid (£)<input name="purchasePrice" inputmode="decimal" placeholder="0.00"></label>
        <label>Value now (£)<input name="currentValue" inputmode="decimal" placeholder="0.00"></label>
      </div>
      <div class="row2">
        <label>Bought on<input name="purchaseDate" type="date"></label>
        <label>Warranty until<input name="warrantyExpiry" type="date"></label>
      </div>
      <label>Bought from<input name="supplier" maxlength="200"></label>
    </section>

    <section class="card">
      <h2>Receipt</h2>
      <div id="receipts" class="filelist"></div>
      <label class="btn">🧾 Add receipt (photo or PDF)
        <input type="file" id="receipt" accept="image/*,application/pdf" multiple hidden>
      </label>
    </section>

    <section class="card">
      <label>Notes<textarea name="notes" rows="3" maxlength="5000"></textarea></label>
      <label>Tags<input name="tags" placeholder="comma separated"></label>
    </section>

    <div id="error" class="error hidden" role="alert"></div>
    <button type="submit" id="save" class="btn primary big">Save to PC</button>
  </form>

  <section id="recentCard" class="card hidden">
    <h2>Recently added</h2>
    <ul id="recent" class="recent"></ul>
  </section>
</main>

<div id="toast" class="toast hidden" role="status"></div>
<datalist id="cats"></datalist>
<datalist id="locs"></datalist>
<script src="/m/app.js"></script>
</body>
</html>
