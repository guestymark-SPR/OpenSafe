name: Build Windows app

# Push to main  -> builds the installer and keeps it under Actions > Artifacts (no release).
# Push a tag v* -> builds and publishes a GitHub release. Installed copies of OpenSafe
#                  find it and update themselves.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$v"; exit 1
          fi

      - name: Build (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish always

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenSafe-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
